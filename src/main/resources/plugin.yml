name: FreeCoreEssentials
version: 2.1.3
main: io.github.freecoreessentials.FreeCoreEssentialsPlugin
description: Vault economy and Floodgate account integration backed by Blessing Skin MySQL.
api-version: '1.21'
authors: [FreeCore]
depend: [Vault]
softdepend: [floodgate, Geyser-Spigot, PlaceholderAPI, FotiaTags, DonutScoreboard, HuskSync, CommandPanels, SimpleVanish]
loadbefore: [FreeCoreShop]
commands:
  fce:
    aliases: [freecoreessentials]
    description: 管理 FreeCoreEssentials
    usage: /fce reload
  menu:
    description: 打开主菜单
    usage: /menu
  m:
    description: 打开主菜单
    usage: /m
  warp:
    aliases: [warps]
    description: 使用或管理服务器传送点
    usage: /warp <名称|list|set|delete>
    permission: freecoreessentials.warp.use
  spawn:
    description: 传送到服务器出生点
    usage: /spawn
    permission: freecoreessentials.spawn.use
  setspawn:
    description: 设置服务器出生点
    usage: /setspawn
    permission: freecoreessentials.spawn.set
  back:
    description: 回到上一次传送前的位置
    usage: /back
    permission: freecoreessentials.back.use
  home:
    description: 传送到自己的家
    usage: /home <名称|list|remove <名称>>
    permission: freecoreessentials.home.use
  sethome:
    description: 在当前位置设置家
    usage: /sethome <名称>
    permission: freecoreessentials.sethome.use
  rtp:
    aliases: [randomteleport]
    description: Random teleport within the current world border
    usage: /rtp
    permission: freecoreessentials.rtp.use
  balance:
    aliases: [bal, money]
    description: 查看自己或其他玩家的 H币余额
    usage: /balance [玩家]
    permission: freecoreeconomy.balance
  baltop:
    aliases: [balancetop]
    description: 在聊天栏查看前100名H币富豪榜
    usage: /baltop [页码]
    permission: freecoreeconomy.baltop
  pay:
    description: 向另一个皮肤站账户转账
    usage: /pay <玩家> <金额>
    permission: freecoreeconomy.pay
  eco:
    aliases: [economy]
    description: 管理玩家的 H币余额
    usage: /eco <give|take|set> <玩家> <金额>
    permission: freecoreeconomy.admin
  setpassword:
    description: 设置基岩版玩家的官网密码
    usage: /setpassword <密码>
    permission: freecoreessentials.setpassword
  invsee:
    description: 查看并编辑任意子服在线玩家的背包
    usage: /invsee <玩家>
    permission: freecoreessentials.invsee
  tpa:
    description: Request teleport to an online player
    usage: /tpa <player>
    permission: freecoreessentials.tpa
  tphere:
    description: Request an online player to teleport to you
    usage: /tphere <player>
    permission: freecoreessentials.tpa
  tpaccept:
    aliases: [tpyes]
    description: Accept a pending teleport request
    usage: /tpaccept [player]
    permission: freecoreessentials.tpa
  tpdeny:
    aliases: [tpno]
    description: Deny a pending teleport request
    usage: /tpdeny [player]
    permission: freecoreessentials.tpa
  seen:
    description: 查看玩家的跨服在线状态与最后离线时间
    usage: /seen <player>
    permission: freecoreessentials.seen
  ip:
    description: 查看玩家的当前登录 IP 与历史 IP 记录
    usage: /ip <player>
    permission: freecoreessentials.ip
  sudo:
    description: 强制目标玩家发言或执行指令
    usage: /sudo <player> <message|c:command>
    permission: freecoreessentials.sudo
  maintenance:
    aliases: [wh]
    description: 开启或关闭子服维护模式
    usage: /maintenance <all|survival|technical|list> [true|false]
    permission: freecoreessentials.maintenance
  gm:
    aliases: [gamemode2]
    description: 快捷切换游戏模式
    usage: /gm <0|1|2|3|s|c|a|sp> [player]
    permission: freecoreessentials.gamemode
  flyspeed:
    aliases: [fs]
    description: 查看或调整飞行速度
    usage: /flyspeed [1-10|default|reset] [player]
    permission: freecoreessentials.speed
  walkspeed:
    aliases: [ws]
    description: 查看或调整步行速度
    usage: /walkspeed [1-10|default|reset] [player]
    permission: freecoreessentials.speed
  say:
    description: 发送全服或指定子服的广播消息
    usage: /say [-s:server] <message>
    permission: freecoreessentials.say
  ping:
    aliases: [latency]
    description: 查看自己或指定玩家的延迟
    usage: /ping [player]
    permission: freecoreessentials.ping
  nick:
    aliases: [nickname]
    description: 设置或重置玩家昵称
    usage: /nick <name|reset|off> [player]
    permission: freecoreessentials.nick
  msg:
    aliases: [tell, w, whisper, m2]
    description: 发送跨服私聊消息
    usage: /msg <player> <message>
    permission: freecoreessentials.msg
  mute:
    description: 禁言指定玩家（全子服同步）
    usage: /mute <player> [duration] [reason]
    permission: freecoreessentials.mute
  unmute:
    description: 解除玩家禁言（全子服同步）
    usage: /unmute <player>
    permission: freecoreessentials.mute
permissions:
  freecoreessentials.sudo:
    default: op
  freecoreessentials.maintenance:
    default: op
  freecoreessentials.maintenance.bypass:
    default: op
  freecoreessentials.gamemode:
    default: op
  freecoreessentials.speed:
    default: op
  freecoreessentials.say:
    default: op
  freecoreessentials.ping:
    default: true
  freecoreessentials.nick:
    default: op
  freecoreessentials.msg:
    default: true
  freecoreessentials.mute:
    default: op
  freecoreessentials.seen:
    default: true
  freecoreessentials.ip:
    default: op
  freecoreeconomy.balance:
    default: true
  freecoreeconomy.balance.others:
    default: op
  freecoreeconomy.baltop:
    default: true
  freecoreeconomy.pay:
    default: true
  freecoreeconomy.admin:
    default: op
  freecoreessentials.setpassword:
    default: true
  freecoreessentials.reload:
    default: op
  freecoreessentials.wealthhologram:
    default: op
  freecoreessentials.warp.use:
    default: true
  freecoreessentials.warp.admin:
    default: op
  freecoreessentials.spawn.use:
    default: true
  freecoreessentials.spawn.set:
    default: op
  freecoreessentials.back.use:
    default: true
  freecoreessentials.home.use:
    default: true
  freecoreessentials.sethome.use:
    default: true
  freecoreessentials.rtp.use:
    default: true
  freecoreessentials.lobby-boundary.bypass:
    default: op
  freecoreessentials.invsee:
    default: op
  freecoreessentials.tpa:
    default: true
  freecoreessentials.crossserver.command:
    default: op
