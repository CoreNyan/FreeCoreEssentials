  texture-url-template: "https://account.lynnhma.xyz/textures/{hash}"
  yggdrasil-profile-url-template: "https://account.lynnhma.xyz/api/yggdrasil/api/users/profiles/minecraft/{name}"
  yggdrasil-session-url-template: "https://account.lynnhma.xyz/api/yggdrasil/sessionserver/session/minecraft/profile/{uuid}"



# =======================================================
# FreeCore 玩家名牌与显示格式管理模块 (Display Configuration)
# 后续调整视觉格式只需修改此处配置，无需重新编译构建 Jar！
# =======================================================
display:
  # Tab 列表格式模板
  # 支持占位符:
  #   %prefix%   - 玩家当前佩戴的称号 (如 [管理员])
  #   %nickname% - 玩家自定义昵称 (未设置时自动使用原名)
  #   %player%   - 玩家原版游戏 ID
  tab-format: "%prefix%%nickname%"

  # 头顶名牌设置 (Nametag)
  # Minecraft 客户端底层渲染玩家模型头顶名牌时，中间锚点为原版玩家模型 {name}
  # 此处可配置前缀和后缀模板：
  nametag:
    # 前缀模板 (渲染在头顶名字左侧)
    prefix: "{prefix}"
    # 后缀模板 (渲染在头顶名字右侧)
    suffix: "{suffix}"

  # 右侧计分板格式
  scoreboard:
    player-format: "%freecore_nickname%"
